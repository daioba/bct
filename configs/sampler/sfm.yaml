# Modified from S-FLM for BCT: adds BCT sampler settings.
predictor: sfm
steps: 1024
noise_removal: ancestral  # 'ancestral' (sample) or 'greedy' (argmax) at the final step
use_float64: true
velocity: exact  # exact / sample
p_nucleus: 1.0
top_k: -1
top_k_velocity: -1  # top-k for velocity computation (-1 = use all vocab)
temperature: 1.0
num_sample_batches: 2
num_sample_log: 2

# BCT (see samplers.SFMSampler).  `mode: none` is upstream S-FLM.
#   none          standard sampling; `temperature` is standard tempering
#   endpoint      BCT-E; requires `temperature: 1.0`
#   path          BCT-P; requires `temperature` equal to `bct.T`,
#                 `velocity: exact` and `top_k_velocity: -1`
#   trained_path  BCT-L, for a TFT model; requires `temperature: 1.0`,
#                 `velocity: exact` and `top_k_velocity: -1`
# `correction_strength` is the strength lambda of BCT-L (trained_path only;
# 1.0 is the full correction).
bct:
  mode: none
  T: 1.0
  correction_strength: 1.0
